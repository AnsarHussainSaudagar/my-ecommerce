    <!-- Reactive Forms -->

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="collapse my-2" id="collapseExample">
        <div class="card card-body">
            <label for="product-name">Name</label>
            <input id="product-name" formControlName="name" type="text" class="form-control">
 
            <!-- First condition will check if its submitted and required validation is false -->
            <div style="color: red;" *ngIf="
            (submitted &&
             !productForm.get('name')?.valid && 
             productForm.get('name')?.errors?.['required']) ||
              (!productForm.get('name')?.valid &&
               productForm.get('name')?.errors?.['required'] &&
                productForm.get('name')?.touched)" >
                Product Name Is Compulsory
            </div>
            <div style="color: red;" *ngIf="!productForm.get('name')?.valid && productForm.get('name')?.errors?.['minlength']" >
                Atleast 10 characters is required
            </div>
            <label for="product-description">description</label>
            <input id="product-description" formControlName="description" type="text" class="form-control">
            <label for="product-price">Price</label>
            <input id="product-price" formControlName="price" type="number" class="form-control">
            <button type="submit" class="btn btn-success">Submit</button>
        </div>
    </form>
</div>
